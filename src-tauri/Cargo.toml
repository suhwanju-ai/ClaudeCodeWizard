[package]
name = "claude-pipeline-wizard"
version = "0.1.0"
edition = "2021"

[lib]
name = "claude_pipeline_wizard_lib"
path = "src/lib.rs"

[[bin]]
name = "claude-pipeline-wizard"
path = "src/main.rs"

[[bin]]
name = "mock_claude"
path = "src/bin/mock_claude.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
